# CI for a TypeTorch game: install, compile (rbxtsc), then `typetorch build` (the payload .rbxm and its checks).
# Optional dev deploy: on a push to a DEV-channel branch, when the repo secret OPENCLOUD_API_KEY exists, the TypeTorch
# action uploads the payload and deploys it (prod-channel branches are skipped here: prod is approved and signed on
# your PC with `typetorch deploy`). Deploys from CI publish only with typetorch.json "approval": "prod" (this
# template's) or "none", and need the key to read and write the registry (universe:read + universe:write), so CI takes
# the right seq. Key scopes: see the CLI README ("Keys").
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCLOUD_API_KEY: ${{ secrets.OPENCLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deploy notes list the commits since the branch's last deploy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rokit tools (rojo, lune)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: "true"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compile (rbxtsc)
        run: bun run build
      - name: Payload (typetorch build)
        run: bun run typetorch build --clean
      - name: Dev deploy
        if: github.event_name == 'push' && env.OPENCLOUD_API_KEY != ''
        uses: typetorch/cli@v0.7.0
        with:
          api-key: ${{ secrets.OPENCLOUD_API_KEY }}
          prod: skip
          test: "true"
